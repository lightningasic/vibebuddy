# Vibe Doge hardware descriptor
#
# HAL manifest for the Vibe Doge — 7+ DOF + LED expression screen.
# Loaded by robotd at startup; see REQ-HAL-001..004 in docs/product/PRD-VBOS-001.md.
#
# NOTE: joint count and IDs are placeholders pending the doge's mechanical bill of
# materials (same caveat as cat.yaml). The chicken manifest is the verified table.

name: "Vibe Doge"
version: 0.1      # placeholder — bump when the BOM is verified

bus:
  type: "dynamixel"
  rate: 50          # Hz — control loop frequency
  baud: 1000000      # 1 Mbps

joints:
  - { id: 20, name: "head_yaw",   limit: [-0.87, 0.87] }
  - { id: 21, name: "head_pitch", limit: [-0.87, 0.87] }
  - { id: 22, name: "left_ear",   limit: [-0.79, 0.79] }
  - { id: 23, name: "right_ear",  limit: [-0.79, 0.79] }
  - { id: 24, name: "tail",       limit: [-1.57, 1.57] }
  - { id: 25, name: "mouth",      limit: [-0.35, 0.52] }
  - { id: 26, name: "blink",      limit: [0.0, 0.79] }

imu:
  bus: "dynamixel"
  id: 200

perception:
  expression: { type: "spi", resolution: [64, 64] }

compute:
  soc: "rk3566"
  ram_gb: 1
  storage_gb: 32

power:
  battery: "li-ion"
  runtime_min: 180