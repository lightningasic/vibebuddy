# Vibe Doge hardware descriptor
#
# HAL manifest for the Vibe Doge — 7+ DOF + LED expression screen.
# Loaded by robotd at startup; see REQ-HAL-001..004 in docs/product/PRD-VBOS-001.md.

name: "Vibe Doge"
version: 1.0

bus:
  type: "dynamixel"
  rate: 50          # Hz — control loop frequency
  baud: 1000000      # 1 Mbps

joints:
  - id: 20  name: "left_ear"    type: "revolute"  limit: [-45, 45]
  - id: 21  name: "right_ear"   type: "revolute"  limit: [-45, 45]
  - id: 22  name: "tail"        type: "revolute"  limit: [-90, 90]
  - id: 23  name: "head"        type: "revolute"  limit: [-60, 60]
  # ... 共 7+ 个关节

imu:
  bus: "dynamixel"
  id: 200
  rate: 50

expression:
  led_screen: { type: "spi", resolution: [64, 64] }

compute:
  soc: "rk3566"
  ram_gb: 1
  storage_gb: 32

power:
  battery: "li-ion"
  runtime_min: 180

policy:
  obs_dim: 61
  action_dim: 7
  rate: 50
  format: "onnx"