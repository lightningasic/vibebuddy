# Vibe Cat hardware descriptor
#
# HAL manifest for the Vibe Cat — desktop companion, 13+ DOF quadruped/crouch.
# Loaded by robotd at startup; see REQ-HAL-001..004 in docs/product/PRD-VBOS-001.md.
#
# NOTE: joint count and IDs are placeholders pending the cat's mechanical bill of
# materials. The chicken manifest is the verified table; this form's table is the next
# thing to lock down before its policy training starts. `vibe-hal`'s tests enforce that
# whatever this file says is internally consistent — duplicates, bad limits and IMU
# collisions all fail CI.

name: "Vibe Cat"
version: 0.1      # placeholder — bump when the BOM is verified

bus:
  type: "dynamixel"
  rate: 50          # Hz — control loop frequency
  baud: 1000000      # 1 Mbps

joints:
  - { id: 20, name: "front_left_shoulder",  limit: [-1.57, 1.57] }
  - { id: 21, name: "front_left_elbow",     limit: [0.0, 2.09] }
  - { id: 22, name: "front_right_shoulder", limit: [-1.57, 1.57] }
  - { id: 23, name: "front_right_elbow",    limit: [0.0, 2.09] }
  - { id: 24, name: "rear_left_shoulder",   limit: [-1.57, 1.57] }
  - { id: 25, name: "rear_left_elbow",      limit: [0.0, 2.09] }
  - { id: 26, name: "rear_right_shoulder",  limit: [-1.57, 1.57] }
  - { id: 27, name: "rear_right_elbow",     limit: [0.0, 2.09] }
  - { id: 30, name: "neck_pitch",           limit: [-0.87, 0.87] }
  - { id: 31, name: "head_pitch",           limit: [-0.87, 0.87] }
  - { id: 32, name: "head_yaw",             limit: [-1.57, 1.57] }
  - { id: 33, name: "head_roll",            limit: [-0.87, 0.87] }
  - { id: 34, name: "tail",                 limit: [-1.57, 1.57] }

imu:
  bus: "dynamixel"
  id: 200

perception:
  camera: { type: "mipi", resolution: [1280, 720] }
  mic: true

compute:
  soc: "rk3566"
  ram_gb: 1
  storage_gb: 32

power:
  battery: "li-ion"
  runtime_min: 120