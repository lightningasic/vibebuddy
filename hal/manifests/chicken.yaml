# Vibe Chicken hardware descriptor
#
# HAL manifest for the Vibe Chicken — 25 cm biped, 15 DOF.
# Loaded by robotd at startup; see REQ-HAL-001..004 in docs/product/PRD-VBOS-001.md.
#
# Joint order is the wire order (`JOINT_NAMES` in vibe-ipc-proto): left leg, neck/head/
# mouth, right leg. The control loop and the IPC layer index positionally, so this order
# must not drift.
#
# Dynamixel IDs mirror the alpha robot's table: 20–24 left leg · 30–34 neck/head/mouth ·
# 10–14 right leg. Limits are anatomical travel in radians; the MJCF (not vendored here)
# is the authority and these are the working values until they are mechanically verified.

name: "Vibe Chicken"
version: 1.0

bus:
  type: "dynamixel"
  rate: 50          # Hz — control loop frequency
  baud: 1000000      # 1 Mbps

joints:
  # left leg
  - { id: 20, name: "left_hip_yaw",    limit: [-1.57, 1.57] }
  - { id: 21, name: "left_hip_roll",   limit: [-1.57, 1.57] }
  - { id: 22, name: "left_hip_pitch",  limit: [-1.57, 1.57] }
  - { id: 23, name: "left_knee",       limit: [0.0, 2.09] }
  - { id: 24, name: "left_ankle",      limit: [-1.05, 1.05] }
  # neck, head, mouth
  - { id: 30, name: "neck_pitch",      limit: [-0.87, 0.87] }
  - { id: 31, name: "head_pitch",      limit: [-0.87, 0.87] }
  - { id: 32, name: "head_yaw",        limit: [-1.57, 1.57] }
  - { id: 33, name: "head_roll",       limit: [-0.87, 0.87] }
  - { id: 34, name: "mouth",           limit: [-0.35, 0.52] }
  # right leg
  - { id: 10, name: "right_hip_yaw",   limit: [-1.57, 1.57] }
  - { id: 11, name: "right_hip_roll",  limit: [-1.57, 1.57] }
  - { id: 12, name: "right_hip_pitch", limit: [-1.57, 1.57] }
  - { id: 13, name: "right_knee",      limit: [0.0, 2.09] }
  - { id: 14, name: "right_ankle",     limit: [-1.05, 1.05] }

imu:
  bus: "dynamixel"
  id: 200           # SFLP orientation board on the same bus

perception:
  tof: { bus: "i2c", id: 0x29 }
  camera: { type: "mipi", resolution: [1280, 720] }

compute:
  soc: "rk3566"
  ram_gb: 1
  storage_gb: 32

power:
  battery: "NP-F550"
  capacity_mah: 2600
  runtime_min: 60