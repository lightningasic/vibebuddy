version: 2
updates:
  # Cargo dependencies. Minor and patch bumps are grouped into one pull request a week so the
  # queue stays readable; a major bump arrives on its own, because that is the one worth reading
  # before merging. The `deny` job in ci.yml re-checks advisories and licenses on every one.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A git dependency pinned to a tag. Dependabot reads `tag = "v0.1.2"` as a version
      # requirement, then cannot reconcile it with the crate's own `version = "0.1.0"` and
      # errors out the whole update run. The pin is deliberate (see tof/Cargo.toml), and a
      # second repository is not something Dependabot can bump for us anyway.
      - dependency-name: bmi088
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The workflows' actions. ci.yml pins each to a commit SHA with the version in a trailing
  # comment; Dependabot is what moves those SHAs forward, rewriting the SHA and the comment
  # together. Without this the pins would be secure and frozen.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
