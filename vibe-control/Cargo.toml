[package]
name = "vibe-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Robot control core: model, bus, sensing"

# `vibe-scan` — the HAL BOM ceremony's field tool. `robotd` trusts the compiled joint table
# because the alpha board is baked into release binaries, and it *assumes* the ids on the
# bus match that table. A scan is the exact opposite exercise: it finds out which ids
# actually answer, with no prior. That is why this bin does **not** reuse `JOINT_IDS` or
# `DynamixelIo::open` — both would smuggle the table back in as a bias. It opens the bus
# and pings `0..=252`, nothing more; pass `--manifest` only when you want the answers
# checked against a descriptor, which is a *later* step of the ceremony, not its premise.
# See `docs/design/descriptor-bom-checklist.md` §3.2–3.3.
[[bin]]
name = "vibe-scan"
path = "src/bin/scan.rs"

[dependencies]
# For `JOINT_NAMES` alone. The joint *order* is protocol — the state stream carries
# `joints` and `targets` as bare arrays — so the table lives in the crate every client
# already links, and this crate re-exports it rather than keeping a second copy in step by
# hand. Not a door onto IPC: nothing here speaks to a socket, and `robotd` already links
# both crates, so no binary gains a dependency from this edge.
vibe-ipc-proto = { path = "../vibe-ipc-proto" }
# The hardware descriptor, so the runtime tables can be *asserted* against the per-form
# manifest rather than trusted by habit. Test-only in spirit, but the loader lives in the
# dependency graph because `robotd` (not just the tests) uses it to self-check at boot.
vibe-hal = { path = "../hal" }
serde = { workspace = true }
# The simulator link speaks newline-delimited JSON — see `sim` for why a packed struct shared
# between two repositories in two languages is the worse trade.
serde_json = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
# `load-dynamic` dlopens libonnxruntime at first use instead of linking it. Two
# consequences, both wanted: the aarch64 cross-build needs no target-arch ONNX Runtime at
# build time, and a laptop with no libonnxruntime still compiles and runs every test that
# does not create a session. Pinned to the version microduck_runtime runs today, so the
# board keeps the ABI it already works against.
# Used to probe for the ONNX Runtime dylib before touching `ort`. Same loader `ort` uses
# internally, so a successful probe means its own load will succeed too — see
# `policy::ensure_runtime` for why that matters.
libloading = "0.9"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }

# 1.6.0 is a floor, not a preference: it de-stuffs protocol 2.0 status packets whose payload
# contains `FF FF FD`. Before it, such a read came back oversized and the fixed-size sync
# reads below — every one of `bus`'s — decoded garbage. A present current of -1 is enough to
# trigger it, so this is a correctness bound on the bus, not a version bump for its own sake.
rustypot = "1.6.0"
# `default-features = false` drops serialport's `libudev` feature, which exists only for
# enumerating ports (`available_ports`). We open one by path from the params file and never
# enumerate — and libudev-sys needs a pkg-config sysroot that the board's cross-build does
# not have, so leaving it on breaks the aarch64 build outright. rustypot disables it for the
# same reason; this crate has to as well, or cargo's feature unification turns it back on.
serialport = { version = "4.8", default-features = false }
